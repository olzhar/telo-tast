<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Тело не врёт — тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EE;
    --card:#FFFFFF;
    --ink:#202B29;
    --ink-soft:#66756F;
    --accent:#2F6F6B;
    --accent-soft:#DCEAE8;
    --gold:#B98B2E;
    --gold-soft:#F3E8D2;
    --line:#DDE4E0;
    --warn:#93453F;
    --warn-soft:#F1DFDD;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding:20px 22px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .back-btn{
    width:34px;height:34px;flex:0 0 34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    visibility:hidden;
  }
  .back-btn.show{visibility:visible;}
  .back-btn svg{width:16px;height:16px;stroke:var(--ink);}
  .track{
    flex:1;
    height:6px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .track-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:6px;
    transition:width .35s ease;
  }
  .step-count{
    font-size:12px;
    color:var(--ink-soft);
    min-width:34px;
    text-align:right;
  }
  main{
    flex:1;
    padding:8px 22px 40px;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:20px;
    margin-bottom:18px;
    font-weight:600;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:28px;
    line-height:1.25;
    margin:0 0 12px;
    letter-spacing:-.2px;
  }
  .lede{
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 22px;
  }
  .lede b{color:var(--ink);font-weight:600;}
  .options{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-top:8px;
  }
  .opt{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px;
    font-size:15.5px;
    line-height:1.45;
    cursor:pointer;
    display:flex;
    align-items:flex-start;
    gap:12px;
    transition:border-color .15s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.99);}
  .opt.checked{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .box{
    width:20px;height:20px;flex:0 0 20px;
    border-radius:6px;
    border:1.6px solid #C4CBC7;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .opt.checked .box{
    background:var(--accent);
    border-color:var(--accent);
  }
  .box svg{width:12px;height:12px;stroke:#fff;display:none;}
  .opt.checked .box svg{display:block;}
  .info-box{
    background:var(--gold-soft);
    border-radius:14px;
    padding:16px 18px;
    margin-top:20px;
  }
  .info-box .label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .info-box p{margin:0 0 8px;font-size:14.5px;line-height:1.6;color:var(--ink);}
  .info-box p:last-child{margin-bottom:0;}
  .highlight{
    border-left:4px solid var(--accent);
    background:var(--accent-soft);
    border-radius:0 12px 12px 0;
    padding:14px 18px;
    margin:18px 0;
    font-weight:600;
    font-size:15px;
    line-height:1.6;
  }
  ul.result-list{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:10px;}
  ul.result-list li{
    display:flex;gap:10px;align-items:flex-start;
    font-size:15px;line-height:1.5;
  }
  ul.result-list li .dot{
    width:20px;height:20px;flex:0 0 20px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;margin-top:1px;
  }
  .quote{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:17px;
    line-height:1.5;
    color:var(--accent);
    margin:0 0 16px;
  }
  .gauge-wrap{margin:22px 0;}
  .gauge-label{
    display:flex;justify-content:space-between;
    font-size:13px;color:var(--ink-soft);margin-bottom:8px;
  }
  .gauge{
    height:8px;border-radius:8px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--gold) 55%, var(--warn) 100%);
    position:relative;
  }
  .gauge .pin{
    position:absolute;top:-5px;
    width:18px;height:18px;border-radius:50%;
    background:#fff;border:3px solid var(--ink);
    transform:translateX(-50%);
  }
  .gauge-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .price-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin:22px 0;
  }
  .price-row{display:flex;align-items:baseline;gap:10px;}
  .old-price{font-size:16px;color:var(--ink-soft);text-decoration:line-through;}
  .new-price{font-family:'Fraunces',serif;font-size:34px;font-weight:600;}
  .footer-fixed{
    width:100%;
    padding:22px 22px 32px;
  }
  .btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px 20px;
    border-radius:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .hint{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .word-tag{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:var(--accent);
    letter-spacing:.03em;
  }

  .score-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:20px 0;font-size:12.5px;}
  .score-table td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6;}
  .score-table tr:last-child td{border-bottom:none;}
  .score-cell-name{width:34%;font-weight:700;color:var(--accent);}
  .score-cell-count{display:block;font-weight:400;color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .score-cell-tags{color:var(--ink-soft);}
  .score-cell-tags span{display:block;}
  .gift-box{background:var(--gold-soft);border-radius:16px;padding:20px;margin:22px 0;}
  @keyframes pulseColor{0%{background:var(--accent);}50%{background:var(--gold);}100%{background:var(--accent);}}
  .btn.pulse{animation:pulseColor 2.2s ease-in-out infinite;}

let answers = blocks.map(b => new Array(b.items.length).fill(false));
let stepIndex = 0;
let resultQueue = [];
let resultSubIndex = 0;
let isEmptyResult = false;
let isLightProfile = false;

const main = document.getElementById('main');
const footer = document.getElementById('footer');
const trackFill = document.getElementById('trackFill');
const stepCount = document.getElementById('stepCount');
const backBtn = document.getElementById('backBtn');

/* считаем только «тяжёлые» отметки (пункты 1–4) — 5-й пункт это профилактика */
function scores(){
  return blocks.map((b,i)=> answers[i].slice(0,4).filter(Boolean).length);
}
function computeResult(){
  const s = scores();
  let heavyCount = 0, lightCount = 0;
  blocks.forEach((b,i)=>{
    b.items.forEach((item,idx)=>{
      if(answers[i][idx]){ if(idx===4) lightCount++; else heavyCount++; }
    });
  });
  isEmptyResult = (heavyCount + lightCount === 0);
  isLightProfile = !isEmptyResult && heavyCount <= 1 && lightCount >= 1;
  const maxScore = Math.max(...s);
  let tied = blocks.filter((b,i)=> s[i]===maxScore).map(b=>b.key);
  if(maxScore < 3 && tied.length > 1){ tied = [tied[0]]; }
  resultQueue = tied;
  resultSubIndex = 0;
}

function render(){
  main.innerHTML = '';
  footer.innerHTML = '';
  updateProgress();

  if(stepIndex === 0) return renderIntro();
  if(stepIndex >=1 && stepIndex <=5) return renderQuestionBlock(stepIndex-1);
  if(stepIndex === 6) return isEmptyResult ? renderEmpty() : (isLightProfile ? renderLightResult() : renderResult());
  if(stepIndex === 7) return renderWhy();
  if(stepIndex === 8) return renderOverview();
}

function updateProgress(){
  backBtn.classList.toggle('show', stepIndex>0);
  const pct = Math.min(100, Math.round((stepIndex/8)*100));
  trackFill.style.width = pct+'%';
  stepCount.textContent = Math.min(stepIndex+1,9)+'/9';
}

function goBack(){
  if(stepIndex===6 && resultSubIndex>0){
    resultSubIndex--;
    render();
    window.scrollTo(0,0);
    return;
  }
  if(stepIndex>0){ stepIndex--; render(); window.scrollTo(0,0); }
}
function goNext(){
  if(stepIndex===5){ computeResult(); }
  if(stepIndex===6 && !isLightProfile && resultSubIndex < resultQueue.length-1){
    resultSubIndex++;
    render();
    window.scrollTo(0,0);
    return;
  }
  stepIndex++;
  render();
  window.scrollTo(0,0);
}

function restartQuiz(){
  answers = blocks.map(b => new Array(b.items.length).fill(false));
  stepIndex = 0;
  resultQueue = [];
  resultSubIndex = 0;
  isEmptyResult = false;
  isLightProfile = false;
  render();
  window.scrollTo(0,0);
}

  main.innerHTML = `

    <h1>Не отметила ни одного пункта</h1>

    <p class="lede">Попробуй ещё раз и отмечай честно всё, что откликается.</p>
  `;
  footer.innerHTML = `<button class="btn" onclick="restartQuiz()">Пройти ещё раз</button>`;
}
